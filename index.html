<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glidePay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="logo">glidePay</div>
        <div class="currency-selector">
            <label for="currency-select">Display Currency:</label>
            <select id="currency-select">
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
                <option value="CHF">CHF - Swiss Franc</option>
                <option value="CNY">CNY - Chinese Yuan</option>
                <option value="SEK">SEK - Swedish Krona</option>
                <option value="NZD">NZD - New Zealand Dollar</option>
                <option value="KRW">KRW - South Korean Won</option>
                <option value="SGD">SGD - Singapore Dollar</option>
                <option value="NOK">NOK - Norwegian Krone</option>
                <option value="MXN">MXN - Mexican Peso</option>
                <option value="INR">INR - Indian Rupee</option>
                <option value="RUB">RUB - Russian Ruble</option>
                <option value="ZAR">ZAR - South African Rand</option>
                <option value="TRY">TRY - Turkish Lira</option>
                <option value="BRL">BRL - Brazilian Real</option>
                <option value="HKD">HKD - Hong Kong Dollar</option>
            </select>
        </div>
    </div>

    <div class="balance-container">
        <div class="balance-grid">
            <div class="balance-card">
                <div class="balance-label">ETH Balance</div>
                <div id="eth-balance" class="balance-amount eth-balance">-</div>
            </div>
            <div class="balance-card">
                <div class="balance-label">Currency Balance</div>
                <div id="currency-balance" class="balance-amount currency-balance">-</div>
                <div id="currency-code" class="balance-secondary">USD</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="status">Welcome to glidePay.</div>
        
        <button id="connectBtn">Connect Wallet</button>
        
        <div id="accountInfo" style="display: none;">
            <div class="section-title">Account Details</div>
            <div class="account-section">
                <div class="balance-label">Connected Address</div>
                <div id="accountAddress" class="address"></div>
                <button id="refreshBtn">Refresh Balance</button>
                
                <!-- Action buttons for send and request -->
                <div class="action-buttons">
                    <button id="sendBtn">Make Transaction</button>
                    <button id="requestBtn">Request</button>
                </div>
            </div>
            
            <!-- Send ETH Form -->
            <div id="sendForm" class="transaction-form">
                <div class="section-title">Make Transaction</div>
                <div class="form-group">
                    <label for="sendTo">Recipient Address</label>
                    <input type="text" id="sendTo" placeholder="0x...">
                </div>
                <div class="form-group">
                    <label for="sendAmount">Amount (ETH)</label>
                    <input type="number" id="sendAmount" min="0" step="0.0001" placeholder="0.01">
                </div>
                <div class="form-group">
                    <label for="sendNote">Add a Note (Optional)</label>
                    <textarea id="sendNote" rows="3" placeholder="Here's your payment!"></textarea>
                </div>
                <div id="sendError" class="error-message" style="display: none;"></div>
                <div class="form-footer">
                    <button id="cancelSendBtn" class="cancel-btn">Cancel</button>
                    <button id="confirmSendBtn">Send Now</button>
                </div>
            </div>
            
            <!-- Request ETH Form -->
            <div id="requestForm" class="transaction-form">
                <div class="section-title">Request</div>
                <div class="form-group">
                    <label for="requestFrom">Request From (Address)</label>
                    <input type="text" id="requestFrom" placeholder="0x...">
                </div>
                <div class="form-group">
                    <label for="requestAmount">Amount (ETH)</label>
                    <input type="number" id="requestAmount" min="0" step="0.0001" placeholder="0.01">
                </div>
                <div class="form-group">
                    <label for="requestNote">Add a Note (Optional)</label>
                    <textarea id="requestNote" rows="3" placeholder="Thanks for the help the other day!"></textarea>
                </div>
                
                <div class="form-footer">
                    <button id="cancelRequestBtn" class="cancel-btn">Cancel</button>
                    <button id="copyRequestLinkBtn">Copy Payment Link</button>
                </div>
            </div>
            
            <!-- Transaction History Section -->
            <div class="transaction-history">
                <div class="section-title">Recent Activity</div>
                <div id="transactionList">
                    <!-- Transactions will be added here by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Transaction Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Confirm Transaction</div>
                <button class="close-modal">&times;</button>
            </div>
            <div id="confirmationDetails">
                <div class="form-group">
                    <label>Recipient</label>
                    <div class="address" id="confirmRecipient"></div>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <div id="confirmAmount" class="balance-amount"></div>
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <div id="confirmNote"></div>
                </div>
            </div>
            <div class="form-footer">
                <button id="cancelConfirmBtn" class="cancel-btn">Cancel</button>
                <button id="finalConfirmBtn">Confirm & Send</button>
            </div>
        </div>
    </div>
    
    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Transaction Successful!</div>
                <button class="close-modal">&times;</button>
            </div>
            <div class="success-message">
                Your transaction has been submitted successfully!
            </div>
            <div class="form-footer">
                <button id="closeSuccessBtn">Close</button>
            </div>
        </div>
    </div>
    
    <!-- Payment Request Modal -->
    <div id="paymentRequestModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Payment Request</div>
                <button class="close-modal">&times;</button>
            </div>
            <div class="payment-request-details">
                <div class="request-message">
                    <span id="requesterAddress"></span> has requested:
                </div>
                <div class="request-amount" id="requestedAmount"></div>
                <div class="request-note" id="requestNote"></div>
            </div>
            <div class="form-footer">
                <button id="declinePaymentBtn" class="cancel-btn">Decline</button>
                <button id="approvePaymentBtn">Pay Now</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
